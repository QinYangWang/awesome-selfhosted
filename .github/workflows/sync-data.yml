name: Sync awesome-selfhosted data

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Sync awesome-selfhosted-data
        run: node scripts/sync-data.mjs

      - name: Fetch GitHub trending
        run: node scripts/fetch-trending.mjs

      - name: AI filter trending repos
        env:
          KIMI_API_KEY: ${{ secrets.KIMI_API_KEY }}
          KIMI_BASE_URL: ${{ secrets.KIMI_BASE_URL || 'https://api.moonshot.cn/v1' }}
        run: node scripts/llm-filter.mjs

      - name: Apply schema & data to D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npx wrangler d1 execute awesome-selfhosted-db --file=./schema.sql --remote
          npx wrangler d1 execute awesome-selfhosted-db --file=./sync.sql --remote
          [ -s discovered.sql ] && npx wrangler d1 execute awesome-selfhosted-db --file=./discovered.sql --remote || echo "No discovered items"
